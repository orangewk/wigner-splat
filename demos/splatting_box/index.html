.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;splatting-box-prototype&#x27;);
  if (!root) return;

  const svgNS = &#x27;http://www.w3.org/2000/svg&#x27;;
  const maxShots = 32000;
  const phases = [0, 30, 60, 90, 120, 150];
  const state = { scenario: &#x27;healthy&#x27;, shots: 0, running: false, timer: null, phaseIndex: 0 };
  const configs = {
    healthy: {
      diagnostic: &#x27;vacuum reference locked&#x27;,
      detail: &#x27;Stable lattice and negative interference structure.&#x27;,
      sigma: 0.34,
      nllStart: 1.780,
      nllDrop: 0.151,
      recommendationShift: 1
    },
    drift: {
      diagnostic: &#x27;phase lock wandering&#x27;,
      detail: &#x27;The lattice rotates between batches; hold or re-lock the LO.&#x27;,
      sigma: 0.38,
      nllStart: 1.802,
      nllDrop: 0.116,
      recommendationShift: 2
    },
    noise: {
      diagnostic: &#x27;electronic noise increasing&#x27;,
      detail: &#x27;Negative structure loses contrast as the measured variance rises.&#x27;,
      sigma: 0.56,
      nllStart: 1.838,
      nllDrop: 0.098,
      recommendationShift: 3
    }
  };

  const els = {
    run: root.querySelector(&#x27;#sbx-run&#x27;),
    shots: root.querySelector(&#x27;#sbx-shots&#x27;),
    nll: root.querySelector(&#x27;#sbx-nll&#x27;),
    coverage: root.querySelector(&#x27;#sbx-coverage&#x27;),
    splats: root.querySelector(&#x27;#sbx-splats&#x27;),
    dots: root.querySelector(&#x27;#sbx-shot-dots&#x27;),
    axis: root.querySelector(&#x27;#sbx-axis-line&#x27;),
    marginalAngle: root.querySelector(&#x27;#sbx-marginal-angle&#x27;),
    bars: root.querySelector(&#x27;#sbx-bars&#x27;),
    modelPath: root.querySelector(&#x27;#sbx-model-path&#x27;),
    dialTicks: root.querySelector(&#x27;#sbx-dial-ticks&#x27;),
    currentHand: root.querySelector(&#x27;#sbx-current-hand&#x27;),
    nextHand: root.querySelector(&#x27;#sbx-next-hand&#x27;),
    currentAngle: root.querySelector(&#x27;#sbx-current-angle&#x27;),
    nextAngle: root.querySelector(&#x27;#sbx-next-angle&#x27;),
    inputStatus: root.querySelector(&#x27;#sbx-input-status&#x27;),
    previewStatus: root.querySelector(&#x27;#sbx-preview-status&#x27;),
    physicalStatus: root.querySelector(&#x27;#sbx-physical-status&#x27;),
    progressTrack: root.querySelector(&#x27;.sb-progress&#x27;),
    progress: root.querySelector(&#x27;#sbx-progress&#x27;),
    diagnosticBox: root.querySelector(&#x27;.sb-diagnostic&#x27;),
    diagnostic: root.querySelector(&#x27;#sbx-diagnostic&#x27;),
    diagnosticDetail: root.querySelector(&#x27;#sbx-diagnostic-detail&#x27;),
    srStatus: root.querySelector(&#x27;#sbx-sr-status&#x27;),
    pipeInput: root.querySelector(&#x27;.sb-pipe-input&#x27;),
    pipePreview: root.querySelector(&#x27;.sb-pipe-preview&#x27;),
    pipePhysical: root.querySelector(&#x27;.sb-pipe-physical&#x27;)
  };

  const makeSvg = (tag, attributes = {}) =&gt; {
    const node = document.createElementNS(svgNS, tag);
    Object.entries(attributes).forEach(([key, value]) =&gt; node.setAttribute(key, String(value)));
    return node;
  };

  const setHand = (line, angle, length) =&gt; {
    const rad = angle * Math.PI / 180;
    line.setAttribute(&#x27;x2&#x27;, String(100 + length * Math.cos(rad)));
    line.setAttribute(&#x27;y2&#x27;, String(85 - length * Math.sin(rad)));
  };

  for (let angle = 0; angle &lt; 360; angle += 30) {
    const rad = angle * Math.PI / 180;
    const inner = angle % 90 === 0 ? 54 : 58;
    const tick = makeSvg(&#x27;line&#x27;, {
      x1: 100 + inner * Math.cos(rad),
      y1: 85 - inner * Math.sin(rad),
      x2: 100 + 64 * Math.cos(rad),
      y2: 85 - 64 * Math.sin(rad),
      class: &#x27;sb-dial-tick&#x27;
    });
    els.dialTicks.appendChild(tick);
  }

  const lattice = [];
  [-2, -1, 0, 1, 2].forEach((ix) =&gt; {
    [-2, -1, 0, 1, 2].forEach((iy) =&gt; {
      lattice.push({ ix, iy, sign: (ix + iy) % 2 === 0 ? 1 : -1 });
    });
  });

  const splatNodes = lattice.map((point) =&gt; {
    const node = makeSvg(&#x27;ellipse&#x27;, {
      cx: 280 + point.ix * 72,
      cy: 193 - point.iy * 57,
      rx: 20,
      ry: 13,
      class: point.sign &gt; 0 ? &#x27;sb-splat-positive&#x27; : &#x27;sb-splat-negative&#x27;
    });
    els.splats.appendChild(node);
    return node;
  });

  const dotNodes = Array.from({ length: 28 }, () =&gt; {
    const node = makeSvg(&#x27;circle&#x27;, { cx: 280, cy: 193, r: 2.2, class: &#x27;sb-shot-dot&#x27;, opacity: 0 });
    els.dots.appendChild(node);
    return node;
  });

  const barNodes = Array.from({ length: 36 }, (_, index) =&gt; {
    const width = 478 / 36;
    const node = makeSvg(&#x27;rect&#x27;, {
      x: 38 + index * width + 1,
      y: 96,
      width: Math.max(1, width - 2),
      height: 0,
      class: &#x27;sb-hist-bar&#x27;
    });
    els.bars.appendChild(node);
    return node;
  });

  const normal = (x, mean, sigma) =&gt; Math.exp(-0.5 * ((x - mean) / sigma) ** 2);

  const density = (x, scenario, observed) =&gt; {
    const cfg = configs[scenario];
    const drift = scenario === &#x27;drift&#x27; ? 0.27 * Math.sin(state.shots / 4200) : 0;
    const centers = [-2.55, -0.86, 0.86, 2.55];
    let value = centers.reduce((sum, center, index) =&gt; {
      const amp = index === 0 || index === 3 ? 0.68 : 1;
      return sum + amp * normal(x, center + drift, cfg.sigma);
    }, 0);
    if (scenario !== &#x27;noise&#x27;) value *= 1 - 0.10 * Math.cos(3.55 * x);
    if (observed &amp;&amp; state.shots &gt; 0) {
      const phase = x * 2.7 + state.shots * 0.00031;
      const sampling = Math.min(0.16, 2.8 / Math.sqrt(state.shots / 640 + 1));
      value *= 1 + sampling * (0.55 * Math.sin(phase) + 0.32 * Math.cos(phase * 1.7));
    }
    return Math.max(0, value);
  };

  const updateSplats = () =&gt; {
    const cfg = configs[state.scenario];
    const settle = 0.20 + 0.80 * (1 - Math.exp(-state.shots / 6500));
    const drift = state.scenario === &#x27;drift&#x27; ? 10 * Math.sin(state.shots / 4300) : 0;
    const blur = state.scenario === &#x27;noise&#x27; ? 1.48 : 1;
    const negativeContrast = state.scenario === &#x27;noise&#x27; ? 0.46 : 1;

    splatNodes.forEach((node, index) =&gt; {
      const point = lattice[index];
      const edge = Math.abs(point.ix) + Math.abs(point.iy);
      const opacity = Math.max(0.08, settle * (1 - edge * 0.045) * (point.sign &lt; 0 ? negativeContrast : 1));
      node.setAttribute(&#x27;rx&#x27;, String((18 + (edge % 2) * 2) * blur));
      node.setAttribute(&#x27;ry&#x27;, String((11 + ((point.ix - point.iy + 4) % 2) * 3) * blur));
      node.setAttribute(&#x27;opacity&#x27;, String(opacity));
      node.setAttribute(&#x27;transform&#x27;, `rotate(${drift + point.ix * 2} ${node.getAttribute(&#x27;cx&#x27;)} ${node.getAttribute(&#x27;cy&#x27;)})`);
    });

    const current = phases[state.phaseIndex];
    const rad = current * Math.PI / 180;
    const half = 245;
    els.axis.setAttribute(&#x27;x1&#x27;, String(280 - half * Math.cos(rad)));
    els.axis.setAttribute(&#x27;y1&#x27;, String(193 + half * Math.sin(rad)));
    els.axis.setAttribute(&#x27;x2&#x27;, String(280 + half * Math.cos(rad)));
    els.axis.setAttribute(&#x27;y2&#x27;, String(193 - half * Math.sin(rad)));

    dotNodes.forEach((node, index) =&gt; {
      if (!state.shots) {
        node.setAttribute(&#x27;opacity&#x27;, &#x27;0&#x27;);
        return;
      }
      const t = ((index * 37 + Math.floor(state.shots / 320)) % 101) / 100 - 0.5;
      const offset = (((index * 19 + state.phaseIndex * 11) % 17) / 16 - 0.5) * (state.scenario === &#x27;noise&#x27; ? 20 : 9);
      const along = t * 390;
      const x = 280 + along * Math.cos(rad) + offset * Math.sin(rad);
      const y = 193 - along * Math.sin(rad) + offset * Math.cos(rad);
      node.setAttribute(&#x27;cx&#x27;, String(x));
      node.setAttribute(&#x27;cy&#x27;, String(y));
      node.setAttribute(&#x27;opacity&#x27;, String(0.16 + (index % 4) * 0.06));
    });
  };

  const updateMarginal = () =&gt; {
    const progress = state.shots / maxShots;
    const observed = barNodes.map((_, index) =&gt; {
      const x = -4 + (index + 0.5) * 8 / barNodes.length;
      return density(x, state.scenario, true) * (0.16 + 0.84 * Math.sqrt(progress));
    });
    const model = Array.from({ length: 91 }, (_, index) =&gt; {
      const x = -4 + index * 8 / 90;
      return { x, value: density(x, state.scenario, false) };
    });
    const maxValue = Math.max(1, ...observed, ...model.map((d) =&gt; d.value));

    barNodes.forEach((node, index) =&gt; {
      const height = 78 * observed[index] / maxValue;
      node.setAttribute(&#x27;y&#x27;, String(96 - height));
      node.setAttribute(&#x27;height&#x27;, String(height));
    });

    const path = model.map((point, index) =&gt; {
      const x = 38 + (point.x + 4) * 478 / 8;
      const y = 96 - 78 * point.value / maxValue;
      return `${index === 0 ? &#x27;M&#x27; : &#x27;L&#x27;}${x.toFixed(2)},${y.toFixed(2)}`;
    }).join(&#x27; &#x27;);
    els.modelPath.setAttribute(&#x27;d&#x27;, path);
    els.modelPath.setAttribute(&#x27;opacity&#x27;, state.shots ? &#x27;1&#x27; : &#x27;0.42&#x27;);
  };

  const updateStatus = () =&gt; {
    const cfg = configs[state.scenario];
    const pct = Math.round(100 * state.shots / maxShots);
    const coverage = state.shots ? Math.min(6, Math.ceil(state.shots / 3840)) : 0;
    const current = phases[state.phaseIndex];
    const next = phases[(state.phaseIndex + cfg.recommendationShift) % phases.length];
    const nll = state.shots
      ? cfg.nllStart - cfg.nllDrop * (1 - Math.exp(-state.shots / 7200))
      : null;

    els.shots.textContent = state.shots.toLocaleString(&#x27;en-US&#x27;);
    els.nll.textContent = nll ? nll.toFixed(4) : &#x27;—&#x27;;
    els.coverage.textContent = `${coverage} / 6`;
    els.marginalAngle.textContent = `θ = ${current}°`;
    els.currentAngle.textContent = `${current}°`;
    els.nextAngle.textContent = `${next}°`;
    setHand(els.currentHand, current, 55);
    setHand(els.nextHand, next, 46);
    els.progress.style.width = `${pct}%`;
    els.progressTrack.setAttribute(&#x27;aria-valuenow&#x27;, String(pct));

    [els.pipeInput, els.pipePreview, els.pipePhysical].forEach((node) =&gt; {
      node.classList.remove(&#x27;is-live&#x27;, &#x27;is-working&#x27;, &#x27;is-warning&#x27;);
    });

    if (!state.shots) {
      els.inputStatus.textContent = &#x27;waiting for shots&#x27;;
      els.previewStatus.textContent = &#x27;not started&#x27;;
      els.physicalStatus.textContent = &#x27;simulated lane · queued&#x27;;
    } else {
      els.pipeInput.classList.add(&#x27;is-live&#x27;);
      els.inputStatus.textContent = state.running ? &#x27;receiving synthetic batches&#x27; : &#x27;stream paused&#x27;;
      if (state.shots &lt; 5500) {
        els.pipePreview.classList.add(&#x27;is-working&#x27;);
        els.previewStatus.textContent = &#x27;forming signed components&#x27;;
        els.physicalStatus.textContent = &#x27;simulated lane · queued&#x27;;
      } else {
        els.pipePreview.classList.add(&#x27;is-live&#x27;);
        els.previewStatus.textContent = &#x27;live preview available&#x27;;
        els.pipePhysical.classList.add(state.shots &lt; 22000 ? &#x27;is-working&#x27; : (state.scenario === &#x27;healthy&#x27; ? &#x27;is-live&#x27; : &#x27;is-warning&#x27;));
        els.physicalStatus.textContent = state.shots &lt; 22000
          ? &#x27;simulated lane · updating&#x27;
          : (state.scenario === &#x27;healthy&#x27; ? &#x27;simulated lane · settled&#x27; : &#x27;simulated lane · review required&#x27;);
      }
    }

    const warning = state.scenario !== &#x27;healthy&#x27; &amp;&amp; state.shots &gt; 6500;
    els.diagnosticBox.classList.toggle(&#x27;is-warning&#x27;, warning);
    els.diagnostic.textContent = cfg.diagnostic;
    els.diagnosticDetail.textContent = state.shots ? cfg.detail : &#x27;Start the synthetic stream to form a state estimate.&#x27;;
    els.run.textContent = state.running ? &#x27;一時停止&#x27; : (state.shots &gt;= maxShots ? &#x27;再測定&#x27; : (state.shots ? &#x27;測定を再開&#x27; : &#x27;測定を開始&#x27;));
  };

  const render = () =&gt; {
    updateSplats();
    updateMarginal();
    updateStatus();
  };

  const stop = () =&gt; {
    state.running = false;
    if (state.timer) window.clearInterval(state.timer);
    state.timer = null;
    render();
  };

  const tick = () =&gt; {
    state.shots = Math.min(maxShots, state.shots + 640);
    state.phaseIndex = (state.phaseIndex + 1) % phases.length;
    render();
    if (state.shots &gt;= maxShots) {
      stop();
      els.srStatus.textContent = &#x27;Synthetic measurement complete.&#x27;;
    }
  };

  els.run.addEventListener(&#x27;click&#x27;, () =&gt; {
    if (state.running) {
      stop();
      els.srStatus.textContent = &#x27;Synthetic measurement paused.&#x27;;
      return;
    }
    if (state.shots &gt;= maxShots) state.shots = 0;
    state.running = true;
    render();
    state.timer = window.setInterval(tick, 260);
    els.srStatus.textContent = &#x27;Synthetic measurement started.&#x27;;
  });

  root.querySelectorAll(&#x27;[data-scenario]&#x27;).forEach((button) =&gt; {
    button.addEventListener(&#x27;click&#x27;, () =&gt; {
      stop();
      state.scenario = button.getAttribute(&#x27;data-scenario&#x27;);
      state.shots = 0;
      state.phaseIndex = 0;
      root.querySelectorAll(&#x27;[data-scenario]&#x27;).forEach((peer) =&gt; {
        peer.setAttribute(&#x27;aria-pressed&#x27;, String(peer === button));
      });
      render();
      els.srStatus.textContent = `Scenario changed to ${button.textContent}.`;
    });
  });

  render();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });

    initialize();

    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });

&lt;/script&gt;
